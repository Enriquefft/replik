name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time placeholders — satisfies Next.js static analysis without real secrets.
      # Runtime secrets must be set in Vercel / deployment environment.
      # ENCRYPTION_KEY is intentionally omitted: hasLiveDb = Boolean(DATABASE_URL && ENCRYPTION_KEY)
      # evaluates to false in CI, causing the live-DB test suite to describe.skip cleanly.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder_for_ci_build_only
      CLERK_SECRET_KEY: sk_test_placeholder_for_ci_build_only
      DATABASE_URL: postgresql://ci:ci@localhost/ci
      TRIGGER_PROJECT_ID: proj_placeholder
      TRIGGER_SECRET_KEY: tr_placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
      OPENAI_API_KEY: sk-placeholder
      APIFY_TOKEN: placeholder
      UPLOADTHING_TOKEN: placeholder
      META_AD_LIBRARY_TOKEN: placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache Bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Dead-code check (knip)
        run: bun run knip

      - name: Build
        run: bun run build

      - name: Test
        # hasLiveDb = Boolean(DATABASE_URL && ENCRYPTION_KEY) — ENCRYPTION_KEY is
        # not set in CI env, so the live-DB describe block skips gracefully.
        run: bun test --bail
